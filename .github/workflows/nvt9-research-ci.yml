name: nvt9-research-ci

on:
  push:
    branches:
      - feature/nvt-validation-v1
      - feature/nvt9-tl-quality-auditor-v1
      - feature/nvt9-tl-audit-evidence-v1
      - feature/nvt9-tl-ownership-join-v1
      - feature/nvt9-tl-stage1-gate-v1
      - feature/nvt9-tl-transition-minimal-v1
  pull_request:
    branches:
      - feature/nvt-validation-v1
  workflow_dispatch:

concurrency:
  group: nvt9-research-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nvt9-research-selftests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile NVT9 research tools
        run: |
          python -m py_compile \
            tools/live_draw/tl_transition.py \
            tools/nvt/build_cross_tf_review.py \
            tools/nvt/audit_nvt9_normal_vs_full_history.py \
            tools/nvt/build_nvt9_deep_lifecycle_state.py \
            tools/nvt/build_nvt9_owner_evidence_review.py \
            tools/nvt/build_nvt9_ownership_adjudication.py \
            tools/nvt/apply_nvt9_ownership_overrides.py \
            tools/nvt/evaluate_nvt9_ownership_gate.py \
            tools/nvt/validate_nvt9_plan_b_contract.py \
            tools/nvt/build_nvt9_tf_mapped_preview.py \
            tools/nvt/build_nvt9_historical_4w.py \
            tools/nvt/build_nvt9_ab_0912_0919.py \
            tools/nvt/build_nvt9_v4_visibility_decision.py \
            tools/nvt/build_nvt9_v4_display_template.py \
            tools/nvt/build_nvt9_v6_visibility_preview.py \
            tools/nvt/validate_nvt9_visibility_invariants.py \
            tools/nvt/prepare_nvt9_v7_preview_ready.py \
            tools/nvt/tl_quality_auditor.py \
            tools/nvt/build_nvt9_tl_quality_history_replay.py \
            tools/nvt/build_nvt9_tl_audit_evidence.py \
            tools/nvt/build_nvt9_tl_quality_ownership_join.py \
            tools/nvt/evaluate_nvt9_tl_quality_stage1_gate.py \
            tests/selftest_tl_transition.py \
            tests/selftest_normal_run.py \
            tests/selftest_nvt9_cross_tf.py \
            tests/selftest_nvt9_normal_vs_full_history.py \
            tests/selftest_nvt9_deep_lifecycle_state.py \
            tests/selftest_nvt9_owner_evidence_review.py \
            tests/selftest_nvt9_ownership_adjudication.py \
            tests/selftest_nvt9_plan_b_contract.py \
            tests/selftest_nvt9_hl_activated_geometry.py \
            tests/selftest_nvt9_tf_mapped_preview.py \
            tests/selftest_nvt9_tfmap_renderer_safety.py \
            tests/selftest_nvt9_history_view.py \
            tests/selftest_nvt9_v4_visibility_decision.py \
            tests/selftest_nvt9_v4_v6_preview.py \
            tests/selftest_nvt9_visibility_invariants.py \
            tests/selftest_nvt9_preview_renderer_safety.py \
            tests/selftest_nvt9_v7_preview_ready.py \
            tests/selftest_nvt9_tl_quality_auditor.py \
            tests/selftest_nvt9_tl_quality_history_replay.py \
            tests/selftest_nvt9_tl_audit_evidence.py \
            tests/selftest_nvt9_tl_quality_ownership_join.py \
            tests/selftest_nvt9_tl_quality_stage1_gate.py

      - name: NormalRun lifecycle replay self-test
        run: python tests/selftest_normal_run.py

      - name: Cross-TF ownership self-test
        run: python tests/selftest_nvt9_cross_tf.py

      - name: Normal vs full-history audit self-test
        run: python tests/selftest_nvt9_normal_vs_full_history.py

      - name: Deep lifecycle state self-test
        run: python tests/selftest_nvt9_deep_lifecycle_state.py

      - name: Owner evidence review self-test
        run: python tests/selftest_nvt9_owner_evidence_review.py

      - name: Ownership adjudication self-test
        run: python tests/selftest_nvt9_ownership_adjudication.py

      - name: Plan B display contract self-test
        run: python tests/selftest_nvt9_plan_b_contract.py

      - name: HL-activated geometry self-test
        run: python tests/selftest_nvt9_hl_activated_geometry.py

      - name: Timeframe display map preview self-test
        run: python tests/selftest_nvt9_tf_mapped_preview.py

      - name: Timeframe display map renderer safety self-test
        run: python tests/selftest_nvt9_tfmap_renderer_safety.py

      - name: V4 visibility decision self-test
        run: python tests/selftest_nvt9_v4_visibility_decision.py

      - name: V4 to V6 preview self-test
        run: python tests/selftest_nvt9_v4_v6_preview.py

      - name: V5 invariant self-test
        run: python tests/selftest_nvt9_visibility_invariants.py

      - name: Preview renderer safety self-test
        run: python tests/selftest_nvt9_preview_renderer_safety.py

      - name: V7 preview readiness self-test
        run: python tests/selftest_nvt9_v7_preview_ready.py

      - name: TL quality auditor self-test
        run: python tests/selftest_nvt9_tl_quality_auditor.py

      - name: TL quality real-history replay self-test
        run: python tests/selftest_nvt9_tl_quality_history_replay.py

      - name: TL audit evidence sidecar self-test
        run: python tests/selftest_nvt9_tl_audit_evidence.py

      - name: TL quality ownership join self-test
        run: python tests/selftest_nvt9_tl_quality_ownership_join.py

      - name: TL Quality Stage-1 readiness gate self-test
        run: python tests/selftest_nvt9_tl_quality_stage1_gate.py

      - name: TL transition state self-test
        run: python tests/selftest_tl_transition.py
